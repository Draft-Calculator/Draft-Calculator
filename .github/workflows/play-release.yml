name: Play release
# Builds the signed Android bundle and (optionally) uploads it to Google Play.
# Run it by hand: Actions > Play release > Run workflow.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to Google Play (false = build only, safe test)"
        type: boolean
        default: false
      track:
        description: "Play track"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      version_name:
        description: "Version name shown to users"
        default: "2.0.0"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/check.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install Bubblewrap core
        run: npm install --no-save @bubblewrap/core@1.27.0
      - name: Restore signing key
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android.keystore"
      - name: Build signed bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number + 100 }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          node tools/build-aab.js
      - uses: actions/upload-artifact@v4
        with:
          name: quick-draft-aab
          path: build/app-release-signed.aab
      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.markjun.quickdraft
          releaseFiles: build/app-release-signed.aab
          track: ${{ inputs.track }}
          status: completed
